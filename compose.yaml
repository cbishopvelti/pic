# Runs pic locally: `docker compose up`, then the React app is on http://localhost:3000 and the
# Phoenix + Hologram backend on http://localhost:4000 (API under /api).
services:
  frontend:
    image: node:22
    working_dir: /app
    command: sh -c "npm install && npm start"
    environment:
      BROWSER: none
      PORT: 3000
      # File events don't always cross a bind mount (Docker Desktop on macOS/Windows), so poll.
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    command: sh -c "mix deps.get && mix ecto.create && mix ecto.migrate && mix holo"
    environment:
      PHX_BIND_ALL: "1"
      DATABASE_PATH: /data/pic_dev.db
    ports:
      - "4000:4000"
    volumes:
      - ./backend:/app
      # Kept out of the bind mount, so the container's builds don't mix with ones on the host.
      - backend_deps:/app/deps
      - backend_build:/app/_build
      - backend_data:/data

volumes:
  frontend_node_modules:
  backend_deps:
  backend_build:
  backend_data:
