# Tests and builds the React app, and publishes it to GitHub Pages (https://cbishopvelti.github.io/pic/)
# on every push to master. Pull requests get the same tests and build, without the deploy.
# Actions sets CI=true, so a lint warning fails the build.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Only the React app is published; backend changes don't need a redeploy.
    paths: [frontend/**, .github/workflows/pages.yml]
  pull_request:
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deploys queue one after another; a pull request's checks only replace that PR's earlier run.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm test

      - run: npm run build

      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
