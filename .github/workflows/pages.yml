# Builds the app and publishes it to GitHub Pages (https://cbishopvelti.github.io/pic/) on every push to
# master, so `npm run buildDeploy` and committing docs/ are no longer needed.
# Needs Settings > Pages > Build and deployment > Source set to "GitHub Actions".
name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
    # Only the React app is published; backend changes don't need a redeploy.
    paths: [frontend/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # CI=true (set by Actions) makes react-scripts fail the build on lint warnings; the app has a few.
      - run: npm run build
        env:
          CI: false

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
